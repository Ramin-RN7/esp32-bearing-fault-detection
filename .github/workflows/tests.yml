name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to a new image from 19 Oct 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Archive checks (syntax, WAV files, archived results table)
        run: python scripts/check_snapshot.py
      - name: Tests (thesis reproduction, feature cache, fold integrity, one-fold LOBO check, ablation rebuild, device runtime)
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      - name: Show failing tests as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)" pytest.log | sed 's/^/::error::/' || true
