name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Archive checks (syntax, WAV files, archived results table)
        run: python scripts/check_snapshot.py
      - name: Tests (thesis reproduction, feature cache, fold integrity, one-fold LOBO check, ablation rebuild, device runtime)
        run: python -m pytest -q
